name: Update Berita Bekasi

on:
  schedule:
    - cron: '0 */3 * * *'   # tiap 3 jam
  workflow_dispatch: {}      # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ambil berita terbaru
        run: python scripts/update_berita.py

      - name: Simpan jika ada perubahan
        run: |
          if git diff --quiet -- berita.json; then
            echo "Tidak ada perubahan."
          else
            git config user.name "berita-bot"
            git config user.email "berita-bot@users.noreply.github.com"
            git add berita.json
            git commit -m "Update berita otomatis"
            git push
          fi
