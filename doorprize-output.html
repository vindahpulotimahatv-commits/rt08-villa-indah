<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123a6b">
<title>Roda Doorprize | Output</title><style>
:root{
  --green:#123a6b;
  --gold:#d5a62b;
  --mint:#e7edf9;
  --muted:#59657f;
  --shadow-lg:0 30px 80px rgba(5,15,36,.18);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;height:100vh;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:
    linear-gradient(180deg,rgba(6,16,36,.72),rgba(8,20,44,.55) 40%,rgba(10,25,56,.85)),
    url("assets/bg-navy.jpg") center top/cover no-repeat;
  color:#fff;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body.bg-transparent{background:transparent}

.event-name{font-weight:900;font-size:clamp(14px,2.4vw,22px);letter-spacing:.4px;opacity:.9;margin-bottom:14px;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.4)}

.stat-row{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap;justify-content:center}
.stat-pill{background:rgba(255,255,255,.12);border:1px solid rgba(213,166,43,.35);border-radius:16px;padding:10px 20px;text-align:center;backdrop-filter:blur(6px);min-width:96px}
.stat-pill strong{display:block;font-size:clamp(18px,2.6vw,26px);color:#fff;line-height:1.15}
.stat-pill span{display:block;font-size:clamp(9px,1.1vw,11px);color:#f3cf6a;font-weight:800;letter-spacing:.4px;margin-top:2px}

.wheel-zone{position:relative;width:min(78vw,78vh,620px);aspect-ratio:1/1}
.pointer{
  position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:5;
  width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;
  border-top:32px solid var(--gold);filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))
}
.wheel-outer{
  width:100%;height:100%;border-radius:50%;padding:10px;background:linear-gradient(145deg,#f4e2ac,var(--gold));
  box-shadow:0 20px 50px rgba(0,0,0,.35)
}
.wheel-wrap{width:100%;height:100%;border-radius:50%;position:relative;transition:transform 5.2s cubic-bezier(.22,.98,.36,1)}
.wheel-wrap canvas{width:100%;height:100%;border-radius:50%;display:block}
.hub{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;
  width:17%;height:17%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--gold) 70%);
  box-shadow:0 4px 14px rgba(0,0,0,.3);border:3px solid #fff8e6
}

.empty-msg{text-align:center;padding:30px 10px}
.empty-msg .em{font-size:44px;margin-bottom:10px}
.empty-msg p{opacity:.82;font-size:clamp(12px,1.6vw,15px);line-height:1.7;max-width:420px;margin:0 auto}

.win-overlay{
  position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(6,14,30,.78);backdrop-filter:blur(4px)
}
.win-overlay.show{display:flex}
.win-card{
  background:#fff;color:var(--green);border-radius:32px;padding:44px 38px;max-width:520px;width:min(88vw,520px);
  text-align:center;box-shadow:var(--shadow-lg)
}
.win-card .em{font-size:60px;margin-bottom:6px}
.win-card h2{margin:0 0 18px;font-size:clamp(20px,3vw,28px)}
.win-card .rumah-pill{display:inline-flex;flex-direction:column;gap:4px;background:var(--mint);border-radius:20px;padding:18px 26px}
.win-card .rumah-pill b{font-size:clamp(22px,3.6vw,32px);color:var(--green)}
.win-card .rumah-pill span{font-size:clamp(13px,2vw,16px);color:var(--muted);font-weight:700}

.confetti-piece{position:fixed;top:-14px;width:9px;height:15px;z-index:60;opacity:.95;border-radius:2px;pointer-events:none;animation:confetti-fall linear forwards}
@keyframes confetti-fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
</style>
</head><body>

<div class="event-name" id="eventName">Roda Doorprize RT 08</div>

<div class="stat-row">
  <div class="stat-pill"><strong id="statTotal">0</strong><span>TERDAFTAR</span></div>
  <div class="stat-pill"><strong id="statMenang">0</strong><span>SUDAH MENANG</span></div>
  <div class="stat-pill"><strong id="statSisa">0</strong><span>SISA PESERTA</span></div>
</div>

<div id="wheelArea">
  <div class="wheel-zone">
    <div class="pointer"></div>
    <div class="wheel-outer">
      <div class="wheel-wrap" id="wheelWrap">
        <canvas id="wheelCanvas" width="900" height="900"></canvas>
      </div>
    </div>
    <div class="hub"></div>
  </div>
</div>

<div id="emptyMsg" class="empty-msg" style="display:none">
  <div class="em">🎪</div>
  <p>Menunggu data peserta / undian dimulai oleh panitia...</p>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <div class="em">🎊</div>
    <h2>Selamat!</h2>
    <div class="rumah-pill"><b id="winRumah">-</b><span id="winNama">-</span></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
// Halaman ini HANYA menampilkan (view-only) — dipakai sebagai Browser Source di vMix.
// Semua putaran dikendalikan dari halaman doorprize.html (dipegang panitia di HP).
// Tambahkan ?bg=transparent di URL kalau mau background transparan (overlay di vMix).

var COLORS = ["#123a6b","#d5a62b","#1c4a86","#f4e2ac","#081c38","#e8c874"];
var state = { order: [], rotation: 0, lastSpinAt: 0 };
var db = null;
var seenInitialSpin = false;

if (new URLSearchParams(location.search).get("bg") === "transparent") {
  document.body.classList.add("bg-transparent");
}

function firebaseReady_(){
  var cfg = RT_CONFIG.firebaseConfig || {};
  return !!(cfg.apiKey && cfg.databaseURL && cfg.appId);
}

document.addEventListener("DOMContentLoaded", function(){
  document.getElementById("eventName").textContent = "🎉 " + (RT_CONFIG.namaAcaraDoorprize || "Acara RT 08");

  if (!firebaseReady_()) {
    document.getElementById("wheelArea").style.display = "none";
    document.getElementById("emptyMsg").style.display = "block";
    document.querySelector("#emptyMsg p").textContent = "Firebase belum dikonfigurasi di config.js.";
    return;
  }
  firebase.initializeApp(RT_CONFIG.firebaseConfig);
  db = firebase.database();

  loadIdle();
  db.ref("liveSpin").on("value", onLiveSpin_);
});

// Dengar perubahan daftar hadir secara live supaya angka statistik & roda idle
// selalu terbaru (mis. setelah panitia menekan "Tandai Sudah Menang").
function loadIdle(){
  db.ref("daftarHadir").on("value", function(snap){
    var rows = [];
    var total = 0, menang = 0;
    snap.forEach(function(child){
      var d = child.val();
      total++;
      if ((d.status || "belum") === "menang") { menang++; }
      else { rows.push({ nama: d.nama || "", rumah: d.rumah || "" }); }
    });
    document.getElementById("statTotal").textContent = total;
    document.getElementById("statMenang").textContent = menang;
    document.getElementById("statSisa").textContent = total - menang;

    // Jangan gambar ulang roda kalau baru saja ada putaran berjalan (biar animasi tidak ketimpa).
    var withinSpinWindow = (Date.now() - state.lastSpinAt) < 6000;
    if (withinSpinWindow) return;

    if (rows.length) {
      state.order = rows;
      drawWheel(state.order);
      toggleEmpty_(false);
    } else {
      toggleEmpty_(true);
    }
  });
}

function toggleEmpty_(empty){
  document.getElementById("wheelArea").style.display = empty ? "none" : "block";
  document.getElementById("emptyMsg").style.display = empty ? "block" : "none";
}

function onLiveSpin_(snap){
  var data = snap.val();
  if (!data || !data.order || !data.order.length) return;

  if (!seenInitialSpin) {
    // Saat halaman output baru dibuka di tengah acara, langsung set posisi akhir
    // tanpa memutar ulang animasi supaya tidak "replay" undian yang sudah lewat.
    seenInitialSpin = true;
    state.order = data.order;
    state.rotation = data.rotation || 0;
    drawWheel(state.order);
    toggleEmpty_(false);
    var wrap = document.getElementById("wheelWrap");
    wrap.style.transition = "none";
    wrap.style.transform = "rotate(" + state.rotation + "deg)";
    void wrap.offsetWidth;
    wrap.style.transition = "";
    return;
  }

  hideWinner_();
  state.order = data.order;
  state.rotation = data.rotation || 0;
  state.lastSpinAt = Date.now();
  drawWheel(state.order);
  toggleEmpty_(false);

  var wrap = document.getElementById("wheelWrap");
  wrap.style.transform = "rotate(" + state.rotation + "deg)";

  setTimeout(function(){
    var winner = state.order[data.winnerIdx];
    if (winner) showWinner_(winner);
  }, 5300);
}

function drawWheel(rem){
  var canvas = document.getElementById("wheelCanvas");
  var ctx = canvas.getContext("2d");
  var n = rem.length;
  if (!n) { ctx.clearRect(0,0,canvas.width,canvas.height); return; }
  var size = canvas.width;
  var cx = size / 2, cy = size / 2, r = size / 2;
  var seg = (Math.PI * 2) / n;
  var showName = n <= 40;
  var margin = r * 0.055;

  ctx.clearRect(0, 0, size, size);
  for (var i = 0; i < n; i++) {
    var start = -Math.PI / 2 + i * seg;
    var end = start + seg;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();

    var nameTxt = String(rem[i].nama || "").trim();
    var rumahTxt = "No. " + String(rem[i].rumah || "").trim();
    var maxChars = Math.max(4, Math.round(320 / n));

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + seg / 2);
    ctx.textAlign = "right";

    if (showName) {
      var nameSize = Math.max(9, Math.min(15, 220 / n));
      var rumahSize = Math.max(8, nameSize - 2);
      ctx.fillStyle = "#fff";
      ctx.font = "800 " + nameSize + "px Inter, sans-serif";
      ctx.fillText(nameTxt.slice(0, maxChars), r - margin, -3);
      ctx.fillStyle = "#f3cf6a";
      ctx.font = "700 " + rumahSize + "px Inter, sans-serif";
      ctx.fillText(rumahTxt.slice(0, maxChars), r - margin, rumahSize + 3);
    } else {
      var soloSize = Math.max(8, Math.min(13, 260 / n));
      ctx.fillStyle = "#fff";
      ctx.font = "800 " + soloSize + "px Inter, sans-serif";
      ctx.fillText(rumahTxt.slice(0, maxChars), r - margin, soloSize / 3);
    }
    ctx.restore();
  }
}

function showWinner_(p){
  document.getElementById("winRumah").textContent = p.rumah;
  document.getElementById("winNama").textContent = p.nama;
  document.getElementById("winOverlay").classList.add("show");
  burstConfetti_();
}

function hideWinner_(){
  document.getElementById("winOverlay").classList.remove("show");
}

function burstConfetti_(){
  var colors = ["#123a6b","#d5a62b","#1c4a86","#c74444","#315f9e"];
  for (var i = 0; i < 60; i++) {
    (function(){
      var el = document.createElement("div");
      el.className = "confetti-piece";
      el.style.left = (Math.random() * 100) + "vw";
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      var dur = 2.6 + Math.random() * 1.6;
      el.style.animationDuration = dur + "s";
      el.style.animationDelay = (Math.random() * 0.4) + "s";
      document.body.appendChild(el);
      setTimeout(function(){ el.remove(); }, (dur + 1) * 1000);
    })();
  }
}
</script>
</body></html>
